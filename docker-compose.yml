services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: basketwise
      POSTGRES_USER: ${DB_USER:-basketwise}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-basketwise}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-basketwise} -d basketwise"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/basketwise
      DB_USER: ${DB_USER:-basketwise}
      DB_PASSWORD: ${DB_PASSWORD:-basketwise}
      DATA_MODE: demo
      ORS_API_KEY: ${ORS_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_CARTO_API_KEY: ${VITE_CARTO_API_KEY:-}
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db-data:
